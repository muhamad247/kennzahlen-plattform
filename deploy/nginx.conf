# Load Balancer vor zwei Instanzen der API.
events {}

http {
    # Docker-DNS regelmäßig neu fragen: eine neu gestartete Instanz kann eine neue IP haben
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream kennzahlen {
        zone kennzahlen 64k;
        # Fällt eine Instanz aus, wird sie 10 Sekunden lang übersprungen
        server app1:8000 resolve max_fails=1 fail_timeout=10s;
        server app2:8000 resolve max_fails=1 fail_timeout=10s;
        keepalive 16;
    }

    log_format json escape=json
        '{"zeit":"$time_iso8601","status":$status,"methode":"$request_method",'
        '"pfad":"$uri","instanz":"$upstream_addr","dauer_s":$request_time,"request_id":"$request_id"}';
    access_log /dev/stdout json;

    server {
        listen 80;
        client_max_body_size 5m;

        # Metriken nur intern für Prometheus, nicht nach außen
        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://kennzahlen;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;

            # Antwortet eine Instanz nicht, geht dieselbe Anfrage an die andere.
            # Nur bei Verbindungsfehlern und 502/503, damit nichts doppelt geschrieben wird.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 1s;
            proxy_read_timeout 30s;

            # zeigt im Ausfalltest, welche Instanz geantwortet hat
            add_header X-Instanz $upstream_addr always;
        }
    }
}
