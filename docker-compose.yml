# Lokaler Betrieb mit allem, was in Azure dazugehört:
# Datenbank, zwei API-Instanzen hinter einem Load Balancer, Prometheus und Grafana.
#   docker compose up -d --build
#   API: http://localhost:8080/docs   Grafana: http://localhost:3000   Prometheus: http://localhost:9090
name: kennzahlen

x-api: &api
  build: .
  environment:
    DATABASE_URL: postgresql://kennzahlen_app:${APP_DB_PASSWORT:-lokal-app}@db:5432/kennzahlen
    LOG_LEVEL: INFO
  depends_on:
    einrichten:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kennzahlen
      POSTGRES_USER: kennzahlen_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORT:-lokal-admin}
    volumes:
      - dbdaten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kennzahlen_admin -d kennzahlen"]
      interval: 2s
      retries: 30

  # Spielt das Schema ein und beendet sich; die API startet erst danach
  einrichten:
    build: .
    command: ["python", "-m", "scripts.einrichten"]
    environment:
      DATABASE_ADMIN_URL: postgresql://kennzahlen_admin:${DB_ADMIN_PASSWORT:-lokal-admin}@db:5432/kennzahlen
      APP_DB_PASSWORT: ${APP_DB_PASSWORT:-lokal-app}
    depends_on:
      db:
        condition: service_healthy

  app1: *api
  app2: *api

  lb:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alarme.yml:/etc/prometheus/alarme.yml:ro

  grafana:
    image: grafana/grafana:11.5.1
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mandanten.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  dbdaten:
